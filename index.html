<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Jardim da Emilly ❤️</title>
    
    <!-- Fonte Cursiva para o Verso da Foto -->
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&display=swap" rel="stylesheet">
    
    <style>
        /* =========================================
           1. ESTILOS GERAIS E FUNDO ANIMADO
        ========================================= */
        body { 
            background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
            color: #333; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            margin: 0; 
            padding: 0; 
            height: 100vh; 
            overflow: hidden; 
            user-select: none; 
            -webkit-user-select: none; 
            touch-action: none; 
            gap: 8px;
            transition: background 3s ease; 
            background-size: 400% 400% !important; 
            animation: gradientMove 15s ease infinite;
        }

        body.level-3 { background: linear-gradient(-45deg, #fdfbfb, #ebedee, #e0c3fc, #a1c4fd); }
        body.level-5 { background: linear-gradient(-45deg, #ff9a9e, #fecfef, #ffdde1, #ff9a9e); }

        @keyframes gradientMove { 
            0% { background-position: 0% 50%; } 
            50% { background-position: 100% 50%; } 
            100% { background-position: 0% 50%; } 
        }

        /* =========================================
           2. LAYOUT: GALERIA LATERAL (FOTOS)
        ========================================= */
        .game-container { 
            display: flex; align-items: center; justify-content: center; 
            width: 100%; gap: 15px; max-width: 100vw; 
        }

        .side-gallery { display: flex; flex-direction: column; gap: 10px; width: 60px; }

        .photo-thumb {
            width: 55px; height: 55px; background: rgba(255,255,255,0.3); border-radius: 12px;
            border: 2px solid rgba(255,255,255,0.5); backdrop-filter: blur(5px);
            display: flex; align-items: center; justify-content: center; font-size: 20px;
            cursor: pointer; overflow: hidden; position: relative; transition: all 0.3s;
        }

        .photo-thumb.locked { opacity: 0.5; filter: grayscale(1); }
        .photo-thumb.unlocked { 
            opacity: 1; filter: grayscale(0); border-color: #ffb6c1; 
            box-shadow: 0 4px 10px rgba(255,182,193,0.4); 
        }
        .photo-thumb img { width: 100%; height: 100%; object-fit: cover; }

        /* =========================================
           3. POLAROID CARD (POPUP DE MEMÓRIA)
        ========================================= */
        #memory-card-overlay {
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            z-index: 100; align-items: center; justify-content: center;
        }

        .polaroid { width: 300px; perspective: 1000px; cursor: pointer; }

        .polaroid-inner {
            position: relative; width: 100%; height: 380px; text-align: center;
            transition: transform 0.8s; transform-style: preserve-3d;
        }

        .polaroid.flipped .polaroid-inner { transform: rotateY(180deg); }

        .polaroid-front, .polaroid-back {
            position: absolute; width: 100%; height: 100%; backface-visibility: hidden;
            background: #fff; padding: 15px; border-radius: 4px; box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            display: flex; flex-direction: column; align-items: center; box-sizing: border-box;
        }

        .polaroid-front img { 
            width: 100%; height: 270px; object-fit: contain; 
            border: 1px solid #ddd; background-color: #f4f4f4; border-radius: 2px;
        }
        .polaroid-front::after { content: "Clique para virar ❤️"; font-size: 12px; color: #999; margin-top: 20px; }

        .polaroid-back { transform: rotateY(180deg); justify-content: center; padding: 30px; background: #fdfaf0; }
        .polaroid-back p { font-family: 'Dancing Script', cursive, serif; font-size: 22px; line-height: 1.5; color: #444; }

        /* =========================================
           4. ELEMENTOS DO JOGO E TABULEIRO
        ========================================= */
        canvas#tetris { 
            background: rgba(30, 40, 45, 0.85); border-radius: 16px; border: 2px solid rgba(255, 255, 255, 0.1);
            max-height: 48vh; width: auto; aspect-ratio: 3 / 5;
        }

        .shake-anim { animation: shake 0.2s both; }
        @keyframes shake { 0% { transform: translate(1px, 1px); } 50% { transform: translate(-2px, 2px); } 100% { transform: translate(0, 0); } }

        .header { display: flex; justify-content: space-between; width: 340px; max-width: 95vw; gap: 8px; margin-top: 10px; }
        .info-box { 
            background: rgba(255,255,255,0.5); backdrop-filter: blur(10px); padding: 8px; 
            border-radius: 15px; text-align: center; flex: 1; border: 1px solid rgba(255,255,255,0.6); 
        }
        .info-title { font-size: 10px; text-transform: uppercase; color: #555; margin-bottom: 2px; font-weight: bold; }
        #score { font-size: 20px; font-weight: 800; }

        .btn-top {
            position: absolute; top: 15px; background: rgba(255,255,255,0.5); border: none; 
            border-radius: 50%; width: 40px; height: 40px; z-index: 20; font-size: 18px; cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1); transition: transform 0.2s;
        }
        .btn-top:active { transform: scale(0.9); }
        .btn-pause { right: 15px; }
        .btn-sound { right: 65px; } 

        .btn-soft-drop {
            background: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.9);
            padding: 8px 30px;
            border-radius: 20px;
            font-weight: bold;
            color: #444;
            margin-top: 5px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }
        .btn-soft-drop:active { background: rgba(200, 200, 200, 0.8); transform: scale(0.98); }
        
        .overlay-screen { 
            display: none; position: absolute; width: 100%; height: 100%; background: rgba(255,255,255,0.4); 
            backdrop-filter: blur(15px); z-index: 50; flex-direction: column; align-items: center; 
            justify-content: center; text-align: center;
        }
        .overlay-card { 
            background: rgba(255,255,255,0.9); padding: 30px; border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); text-align: center; width: 80%; max-width: 320px; 
        }
        .btn-start, .btn-action { 
            background: #ff9a9e; color: #fff; border: none; padding: 12px 30px; 
            border-radius: 30px; font-weight: 700; margin-top: 20px; cursor: pointer; font-size: 16px;
        }
        
        #gesture-hint { 
            background: rgba(255, 255, 255, 0.4); backdrop-filter: blur(10px); padding: 8px 20px; 
            border-radius: 20px; font-size: 12px; color: #444; font-weight: 500; 
            border: 1px solid rgba(255, 255, 255, 0.5); text-align: center; margin-bottom: 5px;
        }

        #combo-text {
            position: absolute; top: 45%; left: 50%; transform: translate(-50%, -50%);
            font-size: 32px; font-weight: 900; color: #fff; text-shadow: 0px 4px 15px rgba(0,0,0,0.3);
            pointer-events: none; opacity: 0; z-index: 15; text-align: center; width: 100%;
        }
        .combo-anim { animation: floatUp 1.5s ease-out forwards; }
        @keyframes floatUp {
            0% { opacity: 0; transform: translate(-50%, -30%) scale(0.8); }
            20% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
            80% { opacity: 1; transform: translate(-50%, -60%) scale(1); }
            100% { opacity: 0; transform: translate(-50%, -80%) scale(0.9); }
        }
    </style>
</head>
<body class="level-1">

    <!-- Tela Inicial -->
    <div id="start-screen" class="overlay-screen" style="display: flex;">
        <h1 style="color: #fff; font-size: 38px; text-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: center; margin-bottom: 20px;">
            Jardim da Emilly 🌸
        </h1>
        <p style="color: #444; font-weight: 500; font-size: 14px; text-align: center; margin-bottom: 20px;">
            Arraste p/ lados: Mover<br>Toque rápido: Girar<br>Deslize p/ baixo: Plantar<br>Deslize p/ cima: Guardar
        </p>
        <button class="btn-start" onclick="iniciarJogo()">Começar Partida</button>
    </div>

    <!-- Tela de Pausa -->
    <div id="pause-screen" class="overlay-screen">
        <div class="overlay-card">
            <h2 id="overlay-title" style="color: #ff6b81; margin-top: 0;">Jogo Pausado ⏸️</h2>
            <button class="btn-action" onclick="togglePause()">Continuar</button>
        </div>
    </div>

    <!-- Tela de Fim de Jogo -->
    <div id="game-over-screen" class="overlay-screen">
        <div class="overlay-card">
            <h2 style="color: #ff6b81; margin-top: 0;">Fim de Jogo! 🥀</h2>
            <p>Ops, o jardim encheu!<br>Mas você fez <strong id="final-score" style="color: #ff6b81;">0</strong> pontos.</p>
            <button class="btn-action" onclick="reiniciarPosGameOver()">Tentar de novo, amor?</button>
        </div>
    </div>

    <!-- Botões Superiores -->
    <button class="btn-top btn-sound" id="btn-som" onclick="toggleSom()">🔊</button>
    <button class="btn-top btn-pause" onclick="togglePause()">⏸️</button>

    <!-- Overlay do Polaroid Card -->
    <div id="memory-card-overlay" onclick="fecharCard(event)">
        <div class="polaroid" id="polaroid-obj" onclick="event.stopPropagation(); this.classList.toggle('flipped')">
            <div class="polaroid-inner">
                <div class="polaroid-front">
                    <img id="card-img" src="" alt="Memória">
                </div>
                <div class="polaroid-back">
                    <p id="card-text"></p>
                    <button class="btn-action" onclick="fecharCard(event)" style="padding: 8px 20px; font-size: 14px; margin-top: auto;">Voltar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Cabeçalho Principal -->
    <div class="header">
        <div class="info-box" id="caixa-hold">
            <div class="info-title">Guardada</div>
            <canvas id="hold-canvas" width="50" height="50"></canvas>
        </div>
        <div class="info-box" style="flex: 1.5;">
            <div class="info-title">Pontos</div>
            <div id="score">0</div>
            <div style="font-size: 10px;">Recorde: <span id="high-score">0</span></div>
            <div style="font-size: 11px; color: #ff6b81; font-weight: 800; margin-top: 5px;">Nível <span id="level">1</span></div>
        </div>
        <div class="info-box">
            <div class="info-title">Próxima</div>
            <canvas id="next-canvas" width="50" height="50"></canvas>
        </div>
    </div>

    <!-- Tabuleiro e Galeria Lateral -->
    <div class="game-container">
        <!-- Coluna Esquerda -->
        <div class="side-gallery" id="gal-left">
            <div class="photo-thumb locked" id="thumb-1" onclick="abrirCard(0)">?</div>
            <div class="photo-thumb locked" id="thumb-3" onclick="abrirCard(2)">?</div>
            <div class="photo-thumb locked" id="thumb-5" onclick="abrirCard(4)">?</div>
            <div class="photo-thumb locked" id="thumb-7" onclick="abrirCard(6)">?</div>
        </div>

        <canvas id="tetris" width="240" height="400"></canvas>

        <!-- Coluna Direita -->
        <div class="side-gallery" id="gal-right">
            <div class="photo-thumb locked" id="thumb-2" onclick="abrirCard(1)">?</div>
            <div class="photo-thumb locked" id="thumb-4" onclick="abrirCard(3)">?</div>
            <div class="photo-thumb locked" id="thumb-6" onclick="abrirCard(5)">?</div>
            <div class="photo-thumb locked" id="thumb-8" onclick="abrirCard(7)">?</div>
        </div>
    </div>

    <div id="gesture-hint">👆 Girar | ↔️ Mover | ⏬ Plantar | ⏫ Guardar</div>

    <!-- Botão de Acelerar Queda (Soft Drop) -->
    <button class="btn-soft-drop" id="btn-soft-drop" 
        onmousedown="isSoftDropping = true" 
        onmouseup="isSoftDropping = false" 
        onmouseleave="isSoftDropping = false" 
        ontouchstart="isSoftDropping = true; event.preventDefault();" 
        ontouchend="isSoftDropping = false; event.preventDefault();">
        ⏬ Segure para Acelerar a Queda
    </button>

    <div style="width: 340px; margin-top: 5px; max-width: 95vw;">
        <iframe style="border-radius:12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);" src="https://open.spotify.com/embed/playlist/3b6HX5idzVBbaZNVXCu8xZ?utm_source=generator" width="100%" height="80" frameBorder="0" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"></iframe>
    </div>

    <div id="combo-text"></div>

    <script>
        /* =========================================
           DADOS E MEMÓRIAS
        ========================================= */
        const memorias = [
            { pts: 50, img: "Fotos/imagem_1.jfif", txt: "A sua pontuação já está no seu tamanho!!!!!!!" },
            { pts: 150, img: "Fotos/imagem_2.jfif", txt: "Lembra quando você comemorou meu aniversário? Aquele dia eu comi a melhor macarronada da minha vida" },
            { pts: 300, img: "Fotos/imagem_3.jfif", txt: "Inclusive, saudades dos nossos banhos longos de piscina" },
            { pts: 500, img: "Fotos/imagem_4.jfif", txt: "Ah, só pra lembrar que você faz os melhores penteados do mundoooo" },
            { pts: 750, img: "Fotos/imagem_5.jfif", txt: "Já que conseguiu uma boa pontuação, irei lhe mostrar a oitava maravilha do mundo" },
            { pts: 1000, img: "Fotos/imagem_6.jfif", txt: "E o que falar da supermãe do brownie?" },
            { pts: 1300, img: "Fotos/imagem_7.jfif", txt: "Posso não ser seu filho, mas tenho absoluta certeza que você cuida de mim como se eu fosse um" },
            { pts: 1600, img: "Fotos/imagem_8.jfif", txt: "Isso não pode ser uma lembrança, mas uma visão do futuro. Você segurando a betinha e sendo a melhor mãe do mundo. Feliz dias das mães." }
        ];

        let unlockedMemories = [];
        try {
            const saved = localStorage.getItem('memoria_jardim');
            if (saved) unlockedMemories = JSON.parse(saved);
        } catch (e) { }

        /* =========================================
           CONFIGURAÇÕES DO MOTOR (TETRIS)
        ========================================= */
        const canvasTetris = document.getElementById('tetris');
        const context = canvasTetris.getContext('2d');
        context.scale(20, 20);

        const holdCanvas = document.getElementById('hold-canvas');
        const holdContext = holdCanvas.getContext('2d');
        holdContext.scale(13, 13);

        const nextCanvas = document.getElementById('next-canvas');
        const nextContext = nextCanvas.getContext('2d');
        nextContext.scale(13, 13);

        const plants = [null, '🌻', '🪻', '🌼', '🌹', '🌷', '🌺', '🌸'];
        const bgColors = [null, '#FFE082', '#9FA8DA', '#EEEEEE', '#EF9A9A', '#F48FB1', '#FFAB91', '#F8BBD0'];

        let jogoRodando = false;
        let jogoPausado = false;
        let score = 0;
        let level = 1;
        let arena = createMatrix(12, 20);
        let particulas = [];
        
        let player = { pos: { x: 0, y: 0 }, matrix: null };
        let nextPeca = null;
        let holdPeca = null;
        let canSwap = true;
        
        let dropCounter = 0;
        let lastTime = 0;
        let lockDelayTime = 0; 
        const LOCK_DELAY = 500; 
        let ghostY = 0;
        let animationId = null;

        let isSoftDropping = false;

        let recorde = 0;
        try {
            recorde = localStorage.getItem('tetrisRecordeEmilly') || 0;
            document.getElementById('high-score').innerText = recorde;
        } catch (e) { }

        /* =========================================
           SISTEMA DE ÁUDIO MELHORADO
        ========================================= */
        let audioCtx;
        let somAtivado = true;
        let audioUnlocked = false;

        function initAudio() {
            try {
                if (!audioCtx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    audioCtx = new AudioContext();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                
                if (!audioUnlocked) {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    gain.gain.value = 0; 
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(audioCtx.currentTime);
                    osc.stop(audioCtx.currentTime + 0.001);
                    audioUnlocked = true;
                }
            } catch(e) {}
        }

        document.body.addEventListener('touchstart', initAudio, { once: true });
        document.body.addEventListener('click', initAudio, { once: true });

        function toggleSom() {
            initAudio(); 
            somAtivado = !somAtivado;
            const btn = document.getElementById('btn-som');
            btn.innerText = somAtivado ? '🔊' : '🔇';
        }

        function tocarSom(tipo) {
            if (!somAtivado || !audioCtx) return;
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);
                
                const now = audioCtx.currentTime;
                
                if (tipo === 'move') {
                    osc.type = 'sine'; osc.frequency.setValueAtTime(300, now); 
                    gain.gain.setValueAtTime(0.3, now); 
                    osc.start(now); osc.stop(now + 0.05);
                } 
                else if (tipo === 'rotate') {
                    osc.type = 'sine'; osc.frequency.setValueAtTime(450, now); 
                    gain.gain.setValueAtTime(0.3, now); 
                    osc.start(now); osc.stop(now + 0.05);
                }
                else if (tipo === 'drop') {
                    osc.type = 'triangle'; osc.frequency.setValueAtTime(150, now); 
                    osc.frequency.exponentialRampToValueAtTime(50, now + 0.1);
                    gain.gain.setValueAtTime(0.6, now); 
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                    osc.start(now); osc.stop(now + 0.1);
                } 
                else if (tipo === 'hold') {
                    osc.type = 'sine'; osc.frequency.setValueAtTime(200, now); 
                    osc.frequency.linearRampToValueAtTime(400, now + 0.1);
                    gain.gain.setValueAtTime(0.3, now); 
                    osc.start(now); osc.stop(now + 0.1);
                }
                else if (tipo === 'clear') {
                    osc.type = 'square'; osc.frequency.setValueAtTime(600, now); 
                    osc.frequency.linearRampToValueAtTime(800, now + 0.1);
                    gain.gain.setValueAtTime(0.4, now); 
                    osc.start(now); osc.stop(now + 0.1);
                }
                else if (tipo === 'combo') {
                    osc.type = 'square'; osc.frequency.setValueAtTime(800, now); 
                    osc.frequency.linearRampToValueAtTime(1200, now + 0.2);
                    gain.gain.setValueAtTime(0.4, now); 
                    osc.start(now); osc.stop(now + 0.2);
                }
                else if (tipo === 'levelUp') {
                    osc.type = 'sine'; osc.frequency.setValueAtTime(400, now); 
                    osc.frequency.setValueAtTime(600, now + 0.1);
                    osc.frequency.setValueAtTime(800, now + 0.2);
                    gain.gain.setValueAtTime(0.5, now); 
                    osc.start(now); osc.stop(now + 0.3);
                }
                else if (tipo === 'gameover') {
                    osc.type = 'sawtooth'; osc.frequency.setValueAtTime(300, now); 
                    osc.frequency.exponentialRampToValueAtTime(50, now + 0.5);
                    gain.gain.setValueAtTime(0.5, now); 
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.5);
                    osc.start(now); osc.stop(now + 0.5);
                }
            } catch(e) {}
        }

        function vibrar(padrao) { 
            try { if (navigator.vibrate) navigator.vibrate(padrao); } catch(e) {}
        }

        /* =========================================
           MÉTODOS DE CRIAÇÃO E FÍSICA
        ========================================= */
        function createMatrix(w, h) {
            const matrix = [];
            for (let i = 0; i < h; i++) matrix.push(new Array(w).fill(0));
            return matrix;
        }

        function createPiece(type) {
            if (type === 'I') return [[0, 1, 0, 0], [0, 1, 0, 0], [0, 1, 0, 0], [0, 1, 0, 0]];
            else if (type === 'L') return [[0, 2, 0], [0, 2, 0], [0, 2, 2]];
            else if (type === 'J') return [[0, 3, 0], [0, 3, 0], [3, 3, 0]];
            else if (type === 'O') return [[4, 4], [4, 4]];
            else if (type === 'Z') return [[5, 5, 0], [0, 5, 5], [0, 0, 0]];
            else if (type === 'S') return [[0, 6, 6], [6, 6, 0], [0, 0, 0]];
            else if (type === 'T') return [[0, 7, 0], [7, 7, 7], [0, 0, 0]];
        }

        function rotate(matrix, dir) {
            for (let y = 0; y < matrix.length; ++y) {
                for (let x = 0; x < y; ++x) {
                    [matrix[x][y], matrix[y][x]] = [matrix[y][x], matrix[x][y]];
                }
            }
            if (dir > 0) matrix.forEach(row => row.reverse());
            else matrix.reverse();
        }

        function collide(arena, playerObj) {
            const m = playerObj.matrix;
            const o = playerObj.pos;
            if (!m) return false;
            for (let y = 0; y < m.length; ++y) {
                for (let x = 0; x < m[y].length; ++x) {
                    if (m[y][x] !== 0) {
                        let tY = y + o.y, tX = x + o.x;
                        if (tY >= 20 || tX < 0 || tX >= 12 || (tY >= 0 && arena[tY][tX] !== 0)) return true;
                    }
                }
            }
            return false;
        }

        function merge(arena, playerObj) {
            playerObj.matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) {
                        let tY = y + playerObj.pos.y, tX = x + playerObj.pos.x;
                        if (tY >= 0 && tY < 20 && tX >= 0 && tX < 12) arena[tY][tX] = value;
                    }
                });
            });
        }

        /* =========================================
           LÓGICA PRINCIPAL DO JOGADOR
        ========================================= */
        function resetPlayer() {
            const pieces = 'ILJOTSZ';
            if (!nextPeca) nextPeca = createPiece(pieces[Math.floor(Math.random() * pieces.length)]);
            player.matrix = nextPeca;
            nextPeca = createPiece(pieces[Math.floor(Math.random() * pieces.length)]);
            
            player.pos.y = 0;
            player.pos.x = Math.floor(12 / 2) - Math.floor(player.matrix[0].length / 2);
            
            canSwap = true;
            isSoftDropping = false;
            updateSidePanels();
            updateGhost();

            if (collide(arena, player)) {
                tocarSom('gameover');
                jogoRodando = false; 
                jogoPausado = true;
                document.getElementById('final-score').innerText = score;
                document.getElementById('game-over-screen').style.display = 'flex';
            }
        }

        function updateGhost() {
            if (!player.matrix) return;
            ghostY = player.pos.y;
            while (!collide(arena, { matrix: player.matrix, pos: { x: player.pos.x, y: ghostY } })) {
                ghostY++;
            }
            ghostY--;
        }

        function processarColagemNoChao() {
            merge(arena, player);
            tocarSom('drop');
            vibrar(25);
            resetPlayer();
            arenaSweep();
            dropCounter = 0;
            lockDelayTime = 0;
        }

        function arenaSweep() {
            let rowCount = 1; let linesCleared = 0; let yLinhas = [];
            for (let y = arena.length - 1; y >= 0; y--) {
                let isFull = true;
                for (let x = 0; x < arena[y].length; x++) {
                    if (arena[y][x] === 0) { isFull = false; break; }
                }
                if (isFull) {
                    const row = arena.splice(y, 1)[0].fill(0);
                    arena.unshift(row);
                    yLinhas.push(y);
                    y++; 
                    score += rowCount * 20; 
                    rowCount *= 2;
                    linesCleared++;
                }
            }
            if (linesCleared > 0) {
                let multiplier = linesCleared === 1 ? 1 : linesCleared === 2 ? 1.5 : linesCleared === 3 ? 2 : 3;
                for(let x = 0; x < 12; x++) {
                    for(let i = 0; i < (4 * multiplier); i++) {
                        particulas.push({
                            x: x + Math.random(), y: yLinhas[0] + Math.random(),
                            vx: (Math.random() - 0.5) * (0.6 * multiplier), vy: (Math.random() - 1) * (0.6 * multiplier),
                            vida: 1.0, cor: bgColors[Math.floor(Math.random() * (bgColors.length - 1)) + 1]
                        });
                    }
                }
                if (linesCleared === 1) { tocarSom('clear'); vibrar([50]); } 
                else if (linesCleared === 2) { vibrar([50, 50, 100]); mostrarCombo("Arranjo Lindo! 🌸"); } 
                else if (linesCleared === 3) { vibrar([50, 100, 150]); mostrarCombo("Buquê Perfeito! 💐"); } 
                else if (linesCleared >= 4) { vibrar([100, 100, 200]); mostrarCombo("Jardim Extraordinário! 🌺"); }
                updateScore();
            }
        }

        function mostrarCombo(texto) {
            const comboDiv = document.getElementById('combo-text');
            comboDiv.innerText = texto;
            comboDiv.classList.remove('combo-anim');
            void comboDiv.offsetWidth; 
            comboDiv.classList.add('combo-anim');
            tocarSom('combo');
        }

        function updateScore() {
            document.getElementById('score').innerText = score;
            if (score > recorde) {
                recorde = score;
                try { localStorage.setItem('tetrisRecordeEmilly', recorde); } catch(e) {}
                document.getElementById('high-score').innerText = recorde;
            }
            
            // CURVA DE DIFICULDADE SUAVIZADA
            // Agora sobe de nível a cada 80 pontos (antes era 50)
            let newLevel = Math.floor(score / 80) + 1;
            
            if (newLevel !== level) {
                tocarSom('levelUp');
                level = newLevel;
                document.getElementById('level').innerText = level;
                document.body.className = ''; 
                if (level >= 5) document.body.classList.add('level-5');
                else if (level >= 3) document.body.classList.add('level-3');
                else document.body.classList.add('level-1');
            }
            checkMemories();
        }

        /* =========================================
           SISTEMA DE MEMÓRIAS
        ========================================= */
        function checkMemories() {
            memorias.forEach((memoria, index) => {
                if (score >= memoria.pts && !unlockedMemories.includes(index)) {
                    unlockedMemories.push(index);
                    try { localStorage.setItem('memoria_jardim', JSON.stringify(unlockedMemories)); } catch(e) {}
                    setTimeout(() => { abrirCard(index); }, 300); 
                }
            });
            renderThumbs();
        }

        function renderThumbs() {
            memorias.forEach((memoria, index) => {
                const thumb = document.getElementById(`thumb-${index + 1}`);
                if (unlockedMemories.includes(index)) {
                    thumb.classList.remove('locked'); thumb.classList.add('unlocked');
                    const fallbackSVG = "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI1MCIgaGVpZ2h0PSI1MCIgdmlld0JveD0iMCAwIDUwIDUwIj48cmVjdCB3aWR0aD0iNTAiIGhlaWdodD0iNTAiIGZpbGw9IiNlZWVlZWUiLz48dGV4dCB4PSIyNSIgeT0iMzAiIGZvbnQtc2l6ZT0iMjAiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGZpbGw9IiM5OTkiPjwvdGV4dD48L3N2Zz4=";
                    thumb.innerHTML = `<img src="${memoria.img}" alt="Memória" onerror="this.src='${fallbackSVG}'">`;
                }
            });
        }

        function abrirCard(index) {
            if (!unlockedMemories.includes(index)) return;
            jogoPausado = true;
            const overlay = document.getElementById('memory-card-overlay');
            const img = document.getElementById('card-img');
            const txt = document.getElementById('card-text');
            document.getElementById('polaroid-obj').classList.remove('flipped');
            
            img.src = memorias[index].img;
            img.onerror = function() { this.src = "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI1MCIgaGVpZ2h0PSI1MCIgdmlld0JveD0iMCAwIDUwIDUwIj48cmVjdCB3aWR0aD0iNTAiIGhlaWdodD0iNTAiIGZpbGw9IiNlZWVlZWUiLz48dGV4dCB4PSIyNSIgeT0iMzAiIGZvbnQtc2l6ZT0iMjAiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGZpbGw9IiM5OTkiPjwvdGV4dD48L3N2Zz4="; };
            txt.innerText = memorias[index].txt;
            overlay.style.display = 'flex';
        }

        function fecharCard(e) {
            if (e) e.stopPropagation();
            document.getElementById('memory-card-overlay').style.display = 'none';
            if (document.getElementById('start-screen').style.display === 'none' && document.getElementById('game-over-screen').style.display === 'none') {
                jogoPausado = false;
            }
        }

        /* =========================================
           RENDERIZAÇÃO VISUAL
        ========================================= */
        function drawMatrix(ctx, matrix, offset, isGhost = false) {
            if (!matrix) return;
            matrix.forEach((row, y) => {
                row.forEach((val, x) => {
                    if (val !== 0) {
                        const gap = 0.05;
                        if (isGhost) {
                            ctx.fillStyle = bgColors[val]; ctx.globalAlpha = 0.2;
                            ctx.fillRect(x + offset.x + gap, y + offset.y + gap, 0.9, 0.9); ctx.globalAlpha = 1.0;
                        } else {
                            ctx.fillStyle = bgColors[val]; ctx.fillRect(x + offset.x + gap, y + offset.y + gap, 0.9, 0.9);
                            ctx.fillStyle = 'rgba(255,255,255,0.4)'; ctx.fillRect(x + offset.x + gap, y + offset.y + gap, 0.9, 0.15); ctx.fillRect(x + offset.x + gap, y + offset.y + gap, 0.15, 0.9);
                            ctx.fillStyle = 'rgba(0,0,0,0.2)'; ctx.fillRect(x + offset.x + gap, y + offset.y + 0.9 - 0.1 + gap, 0.9, 0.15); ctx.fillRect(x + offset.x + 0.9 - 0.1 + gap, y + offset.y + gap, 0.15, 0.9);
                            
                            if (plants[val]) { 
                                ctx.font = '0.75px "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif'; 
                                ctx.textAlign = 'center'; 
                                ctx.textBaseline = 'middle'; 
                                
                                ctx.fillStyle = 'rgba(0,0,0,0.4)';
                                const offsetStroke = 0.02;
                                ctx.fillText(plants[val], x + offset.x + 0.5 + offsetStroke, y + offset.y + 0.55);
                                ctx.fillText(plants[val], x + offset.x + 0.5 - offsetStroke, y + offset.y + 0.55);
                                ctx.fillText(plants[val], x + offset.x + 0.5, y + offset.y + 0.55 + offsetStroke);
                                ctx.fillText(plants[val], x + offset.x + 0.5, y + offset.y + 0.55 - offsetStroke);

                                ctx.fillStyle = '#FFFFFF';
                                ctx.fillText(plants[val], x + offset.x + 0.5, y + offset.y + 0.55); 
                            }
                        }
                    }
                });
            });
        }

        function draw() {
            context.clearRect(0, 0, 12, 20);
            context.strokeStyle = 'rgba(255,255,255,0.05)'; context.lineWidth = 0.05;
            for (let x = 0; x <= 12; x++) { context.beginPath(); context.moveTo(x, 0); context.lineTo(x, 20); context.stroke(); }
            for (let y = 0; y <= 20; y++) { context.beginPath(); context.moveTo(0, y); context.lineTo(12, y); context.stroke(); }

            drawMatrix(context, arena, { x: 0, y: 0 });
            if (player.matrix) {
                drawMatrix(context, player.matrix, { x: player.pos.x, y: ghostY }, true);
                drawMatrix(context, player.matrix, player.pos);
            }

            for (let i = particulas.length - 1; i >= 0; i--) {
                let p = particulas[i]; p.x += p.vx; p.y += p.vy; p.vy += 0.02; p.vida -= 0.03;
                if (p.vida <= 0) particulas.splice(i, 1);
                else { context.fillStyle = p.cor; context.globalAlpha = p.vida; context.fillRect(p.x, p.y, 0.4, 0.4); context.globalAlpha = 1.0; }
            }
        }

        function updateSidePanels() {
            nextContext.clearRect(0, 0, 4, 4);
            if (nextPeca) drawMatrix(nextContext, nextPeca, { x: (4 - nextPeca[0].length) / 2, y: (4 - nextPeca.length) / 2 });
            holdContext.clearRect(0, 0, 4, 4);
            if (holdPeca) drawMatrix(holdContext, holdPeca, { x: (4 - holdPeca[0].length) / 2, y: (4 - holdPeca.length) / 2 });
            
            const caixaHold = document.getElementById('caixa-hold');
            if (caixaHold) {
                caixaHold.style.opacity = canSwap ? "1" : "0.4";
                caixaHold.style.filter = canSwap ? "grayscale(0%)" : "grayscale(80%)";
            }
        }

        /* =========================================
           O LOOP DE ANIMAÇÃO PRINCIPAL E MOTOR FÍSICO
        ========================================= */
        function update(time = 0) {
            if (!jogoRodando || jogoPausado) {
                lastTime = time; animationId = requestAnimationFrame(update); return;
            }
            
            const deltaTime = time - lastTime; lastTime = time; dropCounter += deltaTime;
            
            // Controle de velocidade com o Soft Drop e Limite Máximo de Dificuldade
            // Reduz apenas 35ms por nível (antes era 50ms) e o limite de velocidade humana é de 350ms
            let interval = Math.max(350, 1100 - (level * 35));
            
            if (isSoftDropping) {
                interval = 30; // ⚡ Acelera a peça se estiver segurando o botão
            }
            
            if (dropCounter > interval) {
                player.pos.y++;
                if (collide(arena, player)) {
                    player.pos.y--; 
                    if(isSoftDropping) {
                        lockDelayTime = LOCK_DELAY;
                    }
                } else {
                    lockDelayTime = 0; 
                }
                dropCounter = 0;
            }
            
            player.pos.y++;
            if (collide(arena, player)) {
                player.pos.y--; lockDelayTime += deltaTime;
                if (lockDelayTime >= LOCK_DELAY) processarColagemNoChao();
            } else player.pos.y--;
            
            draw();
            animationId = requestAnimationFrame(update);
        }

        /* =========================================
           AÇÕES DO JOGADOR E MENUS
        ========================================= */
        function playerMove(dir) {
            player.pos.x += dir;
            if (collide(arena, player)) player.pos.x -= dir; 
            else { lockDelayTime = 0; updateGhost(); tocarSom('move'); }
        }

        function playerRotate() {
            const pos = player.pos.x; let offset = 1; rotate(player.matrix, 1); let failsafe = 0;
            while (collide(arena, player) && failsafe < 5) {
                player.pos.x += offset; offset = -(offset + (offset > 0 ? 1 : -1));
                if (offset > player.matrix[0].length) { rotate(player.matrix, -1); player.pos.x = pos; return; }
                failsafe++;
            }
            lockDelayTime = 0; updateGhost(); tocarSom('rotate');
        }

        function playerHardDrop() {
            player.pos.y = ghostY; processarColagemNoChao();
            const canvasEl = document.getElementById('tetris');
            canvasEl.classList.remove('shake-anim'); void canvasEl.offsetWidth; canvasEl.classList.add('shake-anim');
        }

        function playerHold() {
            if (!canSwap) return;
            if (!holdPeca) {
                holdPeca = player.matrix;
                const pieces = 'ILJOTSZ';
                player.matrix = nextPeca;
                nextPeca = createPiece(pieces[Math.floor(Math.random() * pieces.length)]);
            } else {
                let temp = player.matrix; player.matrix = holdPeca; holdPeca = temp;
            }
            player.pos.y = 0; player.pos.x = Math.floor(12 / 2) - Math.floor(player.matrix[0].length / 2);
            canSwap = false; dropCounter = 0; lockDelayTime = 0;
            updateSidePanels(); updateGhost(); tocarSom('hold');
        }

        function iniciarJogo() {
            if (jogoRodando) return;
            
            initAudio();
            
            for (let y = 0; y < arena.length; y++) arena[y].fill(0);
            score = 0; level = 1; updateScore();
            
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('pause-screen').style.display = 'none';
            document.getElementById('game-over-screen').style.display = 'none';
            
            jogoRodando = true; jogoPausado = false;
            resetPlayer(); 
            if (animationId !== null) cancelAnimationFrame(animationId);
            update();
        }

        function reiniciarPosGameOver() {
            document.getElementById('game-over-screen').style.display = 'none';
            jogoRodando = false; iniciarJogo();
        }

        function togglePause() {
            const gameOverAberto = document.getElementById('game-over-screen').style.display === 'flex';
            const cardAberto = document.getElementById('memory-card-overlay').style.display === 'flex';
            if (!jogoRodando || gameOverAberto || cardAberto) return;
            
            jogoPausado = !jogoPausado;
            document.getElementById('pause-screen').style.display = jogoPausado ? 'flex' : 'none';
        }

        /* =========================================
           GERENCIADORES DE EVENTOS
        ========================================= */
        document.addEventListener('keydown', e => {
            if (e.keyCode === 27 || e.keyCode === 80) togglePause();
            if (!jogoRodando || jogoPausado) return;
            
            if (e.keyCode === 37) playerMove(-1);
            else if (e.keyCode === 39) playerMove(1);
            else if (e.keyCode === 40) { player.pos.y++; if (collide(arena, player)) player.pos.y--; else lockDelayTime = 0; } 
            else if (e.keyCode === 38) playerRotate();
            else if (e.keyCode === 32) { e.preventDefault(); playerHardDrop(); }
            else if (e.keyCode === 67 || e.keyCode === 16) playerHold();
        });

        let touchX, touchY, touchStartTime, horizontalMove;
        
        document.addEventListener('touchstart', e => {
            const alvo = e.target;
            if (alvo.closest('.side-gallery') || alvo.closest('button') || alvo.closest('.polaroid') || alvo.closest('iframe')) return;
            touchX = e.touches[0].clientX; touchY = e.touches[0].clientY; touchStartTime = Date.now(); horizontalMove = false;
        }, { passive: false });

        document.addEventListener('touchmove', e => {
            const alvo = e.target;
            if (!jogoRodando || jogoPausado || alvo.closest('.side-gallery') || alvo.closest('button') || alvo.closest('.polaroid') || alvo.closest('iframe')) return;
            e.preventDefault();
            const dx = e.touches[0].clientX - touchX; const dy = e.touches[0].clientY - touchY;
            if (Math.abs(dx) > 25 && Math.abs(dx) > Math.abs(dy)) {
                playerMove(dx > 0 ? 1 : -1); touchX = e.touches[0].clientX; touchY = e.touches[0].clientY; horizontalMove = true;
            }
        }, { passive: false });

        document.addEventListener('touchend', e => {
            const alvo = e.target;
            if (!jogoRodando || jogoPausado || alvo.closest('.side-gallery') || alvo.closest('button') || alvo.closest('.polaroid') || alvo.closest('iframe')) return;
            const dy = e.changedTouches[0].clientY - touchY; const dx = e.changedTouches[0].clientX - touchX; const dt = Date.now() - touchStartTime;
            if (!horizontalMove) {
                if (dt < 250 && Math.abs(dx) < 10 && Math.abs(dy) < 10) playerRotate();
                else if (dy > 50) playerHardDrop();
                else if (dy < -50) playerHold();
            }
        });

        renderThumbs();
    </script>
</body>
</html>
